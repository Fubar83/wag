# wag config: a small starting point that works on Windows, Linux and macOS.
# Copy to ~/.config/wag/config.yaml. Every step is a bash command line.

projects: ~/projects

hooks:
  # For every repo of the feature, in its worktree.
  repo:
    create:
      - cp "$WAG_MAIN/.env" .env 2>/dev/null || true   # its main checkout's .env, if it has one
  # Once for the whole feature, in the feature folder that holds the worktrees.
  feature:
    create:
      - printf '# %s\n' "$WAG_BRANCH" > NOTES.md       # one note beside the worktrees
    remove:
      - rm -f NOTES.md                                 # take it with the feature

repos:
  api:
    create:
      - npm ci                                         # for this repo only, after the hooks.repo steps
