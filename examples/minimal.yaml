# wag config: a small starting point that works on Windows, Linux and macOS.
# Every step is a bash command line, written after "- |" so no YAML quoting rules apply to it.
# Copy to ~/.config/wag/config.yaml.

projects: ~/projects

hooks:
  # For every repo of the feature, in its worktree.
  repo:
    create:
      # Its main checkout's .env, if it has one.
      - |
        cp "$WAG_MAIN/.env" .env 2>/dev/null || true
  # Once for the whole feature, in the feature folder that holds the worktrees.
  feature:
    create:
      # One note beside the worktrees.
      - |
        printf '# %s\n' "$WAG_BRANCH" > NOTES.md
    remove:
      # Take it with the feature, so the folder can go too.
      - |
        rm -f NOTES.md

repos:
  api:
    create:
      # For this repo only, after the hooks.repo steps.
      - |
        npm ci
